<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SerdSafely{% endblock %}</title>
  <style>
    /* Inlined rather than served from /static: nginx proxies every request to
       this app, so a stylesheet would be one more round trip through it for
       no benefit at this size. */
    :root {
      --bg: #0b0f17;
      --panel: #121826;
      --border: #1f2937;
      --ink: #e6edf7;
      --muted: #93a4bd;
      --accent: #5b9dff;
      --good: #34d399;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    .shell { width: 100%; max-width: 640px; }
    .mark {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .3rem .7rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(91, 157, 255, .08);
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .mark svg { width: 15px; height: 15px; color: var(--accent); }
    h1 { margin: 1.1rem 0 .4rem; font-size: 2.4rem; letter-spacing: -.02em; }
    h1 .tail { color: var(--accent); }
    .lede { margin: 0 0 1.75rem; color: var(--muted); }
    .panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 1.25rem 1.4rem;
    }
    .panel h2 {
      margin: 0 0 .9rem;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .points { list-style: none; margin: 0; padding: 0; display: grid; gap: .7rem; }
    .points li { display: flex; gap: .6rem; align-items: flex-start; }
    .points svg { width: 17px; height: 17px; color: var(--good); flex: none; margin-top: .18rem; }
    code {
      padding: .12rem .38rem;
      border-radius: 5px;
      background: #0d1420;
      border: 1px solid var(--border);
      font-size: .88em;
    }
    .code-status {
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: -.03em;
      margin: 1.1rem 0 .2rem;
      color: var(--bad);
    }
    footer { margin-top: 1.5rem; color: var(--muted); font-size: .86rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="shell">
    {% block body %}{% endblock %}
  </main>
</body>
</html>
