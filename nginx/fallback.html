<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temporarily unavailable — SerdSafely</title>
  <style>
    /* Deliberately self-contained: this page is shown precisely when the
       backend cannot be reached, so it must not depend on anything it
       serves. Keep it in step with backend/app/templates/base.html by eye. */
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2.5rem 1.25rem;
      background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, #0b0f17 60%);
      color: #e6edf7;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    main { max-width: 640px; }
    .mark {
      display: inline-block; padding: .3rem .7rem;
      border: 1px solid #1f2937; border-radius: 999px;
      background: rgba(91,157,255,.08); color: #93a4bd;
      font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
    }
    h1 { margin: 1.1rem 0 .4rem; font-size: 2rem; letter-spacing: -.02em; }
    p { margin: 0; color: #93a4bd; }
  </style>
</head>
<body>
  <main>
    <span class="mark">SerdSafely</span>
    <h1>Temporarily unavailable</h1>
    <p>This service is not responding at the moment. Please try again shortly.</p>
  </main>
</body>
</html>
