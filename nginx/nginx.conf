# Rendered by the nginx image's envsubst step at container start, so the
# backend upstream can differ per environment: the container name under docker
# compose, loopback when both containers share a single task.
#
# nginx serves no files of its own. The front page, the error pages and the
# downloads all come from the backend, so there is one place that decides what
# this service looks like.

log_format json_access escape=json '{'
  '"time":"$time_iso8601",'
  '"request_id":"$request_id",'
  '"remote_addr":"$remote_addr",'
  '"forwarded_for":"$http_x_forwarded_for",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_status":"$upstream_status",'
  '"upstream_time":"$upstream_response_time",'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent"'
'}';

# Health checkers poll constantly and say nothing useful when they pass, so
# they are kept out of the log rather than drowning it.
map $http_user_agent $loggable {
    default                1;
    "~^ELB-HealthChecker"  0;
    "~^kube-probe"         0;
}

# Named distinctly from the host it points at, so there is no ambiguity between
# the upstream's name and a server address of the same name.
upstream app_backend {
    server ${BACKEND_HOST}:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    access_log /dev/stdout json_access if=$loggable;
    error_log  /dev/stderr warn;

    # Delivery only: nothing here accepts a file. The POST endpoints that do
    # exist (/api/refresh, /api/logging) carry no body, so anything larger than
    # a stray header is refused here rather than reaching the app.
    client_max_body_size 8k;

    # Set here, where the first error happens, not just where it is handled:
    # the fallback below is reached by failing while already serving an error
    # page, and nginx checks this at the point the recursion starts.
    recursive_error_pages on;

    # Errors nginx raises on its own behalf — a request it rejects before the
    # backend is involved, or the backend being unreachable. Each maps to a
    # literal URI so the backend is told the exact status; with no "=" nginx
    # keeps the original status code and swaps in only the body.
    #
    # Backend errors are deliberately NOT intercepted (proxy_intercept_errors
    # stays off, its default): the backend already renders these same pages,
    # and intercepting would also throw away its JSON replies to API callers.
    error_page 400 /errors/400;
    error_page 401 /errors/401;
    error_page 403 /errors/403;
    error_page 404 /errors/404;
    error_page 405 /errors/405;
    error_page 408 /errors/408;
    error_page 413 /errors/413;
    error_page 414 /errors/414;
    error_page 429 /errors/429;
    error_page 431 /errors/431;
    error_page 500 /errors/500;
    error_page 502 /errors/502;
    error_page 503 /errors/503;
    error_page 504 /errors/504;

    # Reachable only through the error_page directives above, not from outside.
    location /errors/ {
        internal;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy_common.conf;
        # Do not let a struggling backend hold the error page open.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        # When the backend is what failed, fetching the page from it fails
        # too. Without this the visitor gets stock nginx - the exact thing
        # these pages exist to avoid - so fall back to a static copy baked
        # into this image.
        error_page 500 502 503 504 @unavailable;
    }

    # Last resort. No upstream, no dependencies: just a file on disk.
    location @unavailable {
        internal;
        root /usr/share/nginx/fallback;
        try_files /fallback.html =503;
    }

    # Downloads. Streamed rather than buffered, so a large file does not have
    # to land on nginx's disk before the first byte reaches the client.
    location /docs/ {
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy_common.conf;

        # Fail fast when the backend is down; the default is 60s, which
        # leaves a visitor staring at a blank tab before any page appears.
        proxy_connect_timeout 5s;

        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The front page and everything else.
    location / {
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy_common.conf;

        # Fail fast when the backend is down; the default is 60s, which
        # leaves a visitor staring at a blank tab before any page appears.
        proxy_connect_timeout 5s;
    }
}
