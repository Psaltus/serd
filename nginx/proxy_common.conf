# Shared by every proxying location. Kept in one file so a header cannot be
# set on some routes and forgotten on others.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# nginx generates a unique id per request. Passing it on, and logging it at
# both ends, is what lets one request be followed from the access log into the
# application log.
proxy_set_header X-Request-Id $request_id;

# Both are required for the upstream's keepalive pool to be used: HTTP/1.1,
# and an empty Connection header so the client's own is not forwarded.
proxy_http_version 1.1;
proxy_set_header Connection "";
